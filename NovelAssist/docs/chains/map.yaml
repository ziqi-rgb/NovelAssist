  - id: m_city_build
    type: write
    premise: "将规划好的【城池与街区】地点写入数据库。"
    write_to:
      entity: location
      field: description
      action: create
    next: m_city_verify

  - id: m_city_verify
    type: reasoning
    premise: "校验：【城池与街区】层级的所有地点是否全部创建成功？"
    branches:
      - condition: CONTINUE
        target: m_city_build
      - condition: DONE
        target: 
    prompt: "【地点创建校验】 数据库中当前所有地点：{locations_full_detail}  请判断属于【城池与街区】层级（scale_level 为 城池→街区 中任一值）的所有计划地点是否已全部创建？ - 还有未创建的 → <ROUTE>C..."

