    prompt: "【大纲创建校验】 数据库中当前所有大纲：{outlines_full_detail}  请判断分类为 [能力体系设定] 的所有计划大纲条目是否已全部创建？ - 还有未创建的 → <ROUTE>CONTINUE</ROUTE> - 全部创建完..."

  - id: o_story_check
    type: router
    premise: "判定：是否需要创建或扩充【剧情大纲推演】？"
    branches:
      - condition: YES
        target: o_story_plan
      - condition: NO
        target: 

