    premise: "校验：地理知识设定 是否全部创建完毕？"
    branches:
      - condition: CONTINUE
        target: o_geo_build
      - condition: DONE
        target: o_char_check
    prompt: "【大纲创建校验】 数据库中当前所有大纲：{outlines_full_detail}  请判断分类为 [地理] 的所有计划大纲条目是否已全部创建？ - 还有未创建的 → <ROUTE>CONTINUE</ROUTE> - 全部创建完毕 → ..."

  - id: o_char_check
    type: router
    premise: "判定：是否需要创建或扩充【人物粗略设定】？"
    branches:
      - condition: YES
