    prompt: "【大纲创建校验】 数据库中当前所有大纲：{outlines_full_detail}  请判断分类为 [剧情大纲] 的所有计划大纲条目是否已全部创建？ - 还有未创建的 → <ROUTE>CONTINUE</ROUTE> - 全部创建完毕 ..."

